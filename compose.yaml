services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-wager-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '${POSTGRES_PORT}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14.0
    container_name: jungle-wager-localstack

    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_STRATEGY: path

    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'

    volumes:
      - './docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'awslocal sqs get-queue-url --queue-name wager-transactions.fifo',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
